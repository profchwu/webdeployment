<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>數學探險家</title><style>body{font-family:system-ui,"Noto Sans TC",sans-serif;background:linear-gradient(135deg,#dfeafe,#f5f7ff);margin:0;color:#17284c;min-height:100vh;display:grid;place-items:center}.app{background:#fff;padding:clamp(20px,5vw,42px);border-radius:24px;width:min(92vw,660px);box-shadow:0 16px 50px #243e7130}h1{margin:0 0 6px;color:#234b99}#status{color:#65748e}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}button{padding:16px;border:1px solid #c6d8f3;border-radius:12px;background:#eef4ff;color:#183666;font-size:17px;cursor:pointer}button:hover{background:#d8e6ff}button:disabled{opacity:.65}#next{background:#2c5bc5;color:white;border:none}#result{font-weight:750;min-height:26px}@media(max-width:500px){.answers{grid-template-columns:1fr}}</style></head><body><main class="app"><div style="font-size:36px">🧮</div><h1>數學探險家</h1><p>AI 網站部署教學作品示範｜國立清華大學 數理教育研究所 吳智鴻教授</p><p id="status"></p><h2 id="question"></h2><div class="answers" id="answers"></div><p id="result" aria-live="polite"></p><button id="next" hidden>下一題 →</button></main><script>const qs=[{q:"12 + 8 = ?",a:[16,18,20,22],correct:2},{q:"9 × 7 = ?",a:[56,63,72,54],correct:1},{q:"48 ÷ 6 = ?",a:[6,7,8,9],correct:2},{q:"15 − 9 = ?",a:[5,6,7,8],correct:1},{q:"(5 + 3) × 4 = ?",a:[20,28,32,36],correct:2}];let n=0,score=0;const $=id=>document.getElementById(id);function render(){if(n>=qs.length){$("status").textContent="恭喜完成闖關！";$("question").textContent="總分 "+score+"／"+qs.length;$("answers").innerHTML="";$("result").textContent=score===5?"全部答對，太棒了！":"再挑戰一次，看看能否進步！";$("next").textContent="重新挑戰 ↻";$("next").hidden=false;return;}$("status").textContent="第 "+(n+1)+"／"+qs.length+" 題 · 已答對 "+score+" 題";$("question").textContent=qs[n].q;$("result").textContent="";$("next").hidden=true;$("next").textContent="下一題 →";$("answers").innerHTML="";qs[n].a.forEach((v,i)=>{let b=document.createElement("button");b.textContent=v;b.onclick=()=>{let yes=i===qs[n].correct;if(yes)score++;$("result").textContent=yes?"✅ 答對了！":"❌ 正確答案："+qs[n].a[qs[n].correct];$("answers").querySelectorAll("button").forEach(x=>x.disabled=true);$("next").hidden=false;};$("answers").append(b)})}$("next").onclick=()=>{if(n>=qs.length){n=0;score=0}else n++;render()};render();</script></body></html>
